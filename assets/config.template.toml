# knowledge_base = """
# Q: 你们的设计服务价格是多少？
# A: 根据项目复杂度，品牌设计 5000-20000 元，UI 设计按页面计费 500-2000 元/页。
#
# Q: 设计周期是多久？
# A: Logo 设计 3-5 个工作日，完整品牌设计 2-4 周，UI 设计根据页面数量 1-3 周。
#
# 我们的优势：10 年设计经验，服务过 200+ 客户，支持无限次修改直到满意。
# """
